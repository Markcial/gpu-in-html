name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # ubuntu-latest has no WebGPU adapter. `vgpu check --require-validation`
      # does not download a CPU renderer on its own; install the portable
      # lavapipe build so device-backed validation can acquire one.
      - run: pnpm exec vgpu install-software-renderer

      # Compiles every shader and its module graph. Catches a broken primitive
      # before any example has to import it.
      - run: pnpm check

      - run: pnpm typecheck

      - run: pnpm build
