<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>04 · Lumen</title>
    <style>
      :root {
        color-scheme: dark;
        --hot: #ff6a4a;
        --dim: #7a7168;
        --ink: #ece6e0;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #070405;
        color: var(--ink);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .back {
        position: fixed;
        top: 16px;
        left: 18px;
        z-index: 3;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        color: var(--ink);
        background: rgba(8, 5, 6, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 7px 14px;
        backdrop-filter: blur(6px);
      }

      .back:hover {
        background: rgba(8, 5, 6, 0.85);
      }

      /* Ordinary DOM over the canvas. The shader's state is what it reports. */
      .panel {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 2;
        width: min(320px, calc(100vw - 36px));
        padding: 15px 16px 16px;
        background: rgba(8, 5, 6, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-left: 2px solid var(--hot);
        backdrop-filter: blur(9px);
      }

      .panel h1 {
        margin: 0 0 2px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .panel .sub {
        margin: 0 0 13px;
        color: var(--dim);
        font-size: 11px;
      }

      .readouts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 7px 14px;
        margin-bottom: 13px;
      }

      .readout {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px dotted rgba(255, 255, 255, 0.13);
        padding-bottom: 3px;
      }

      .readout span:first-child {
        color: var(--dim);
      }

      .readout span:last-child {
        font-variant-numeric: tabular-nums;
      }

      label.slider {
        display: block;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 7px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.18);
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 20px;
        background: var(--hot);
        cursor: ew-resize;
      }

      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 20px;
        border: none;
        border-radius: 0;
        background: var(--hot);
        cursor: ew-resize;
      }

      .hint {
        position: fixed;
        right: 18px;
        bottom: 20px;
        z-index: 2;
        color: var(--dim);
        font-size: 11px;
      }

      #error {
        position: fixed;
        inset: auto 18px 18px;
        z-index: 4;
        margin: 0;
        padding: 12px;
        background: #240a0a;
        color: #ff9a9a;
        white-space: pre-wrap;
      }

      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <a class="back" href="../../">← gallery</a>

    <section class="panel" id="panel">
      <h1>Lumen</h1>
      <p class="sub">Endoluminal survey · mucosal wall</p>

      <div class="readouts">
        <div class="readout"><span>perfusion</span><span id="r-depth">—</span></div>
        <div class="readout"><span>tone</span><span id="r-tone">—</span></div>
        <div class="readout"><span>lamp</span><span>on axis</span></div>
        <div class="readout"><span>mucosa</span><span id="r-mucosa">—</span></div>
      </div>

      <label class="slider" for="tone">Muscular tone</label>
      <input id="tone" type="range" min="0" max="100" value="45" />
    </section>

    <p class="hint">drag the slider to change tone</p>

    <pre id="error"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
