<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>03 · Mutation</title>
    <style>
      :root {
        color-scheme: dark;
        --hot: #ff3b1f;
        --dim: #6c6f78;
        --ink: #e6e3dd;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #08080a;
        color: var(--ink);
        font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.02em;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }

      .back {
        position: fixed;
        top: 16px;
        left: 18px;
        z-index: 3;
        font-size: 12px;
        font-weight: 600;
        text-decoration: none;
        color: var(--ink);
        background: rgba(10, 10, 14, 0.55);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 7px 14px;
        backdrop-filter: blur(6px);
      }

      .back:hover {
        background: rgba(10, 10, 14, 0.85);
      }

      /* The panel is ordinary DOM sitting over the canvas. Nothing here is
         drawn by the shader — but the shader's state drives how it reads. */
      .panel {
        position: fixed;
        left: 18px;
        bottom: 18px;
        z-index: 2;
        width: min(340px, calc(100vw - 36px));
        padding: 16px 17px 17px;
        background: rgba(8, 8, 10, 0.62);
        border: 1px solid rgba(255, 255, 255, 0.13);
        border-left: 2px solid var(--hot);
        backdrop-filter: blur(9px);
        transition: border-color 200ms ease, background 200ms ease;
      }

      .panel[data-level="critical"] {
        border-color: var(--hot);
        background: rgba(28, 6, 4, 0.7);
      }

      .panel h1 {
        margin: 0 0 2px;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .panel .sub {
        margin: 0 0 14px;
        color: var(--dim);
        font-size: 11px;
      }

      .readouts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px 14px;
        margin-bottom: 14px;
      }

      .readout {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        border-bottom: 1px dotted rgba(255, 255, 255, 0.14);
        padding-bottom: 3px;
      }

      .readout span:first-child {
        color: var(--dim);
      }

      .readout span:last-child {
        font-variant-numeric: tabular-nums;
      }

      label.slider {
        display: block;
        color: var(--dim);
        font-size: 11px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin-bottom: 7px;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        width: 100%;
        height: 3px;
        background: rgba(255, 255, 255, 0.18);
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 20px;
        background: var(--hot);
        cursor: ew-resize;
      }

      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 20px;
        border: none;
        border-radius: 0;
        background: var(--hot);
        cursor: ew-resize;
      }

      #status {
        margin: 12px 0 0;
        font-size: 11px;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
      }

      .panel[data-level="critical"] #status {
        color: var(--hot);
      }

      .hint {
        position: fixed;
        right: 18px;
        bottom: 20px;
        z-index: 2;
        color: var(--dim);
        font-size: 11px;
      }

      #error {
        position: fixed;
        inset: auto 18px 18px;
        z-index: 4;
        margin: 0;
        padding: 12px;
        background: #240a0a;
        color: #ff9a9a;
        white-space: pre-wrap;
      }

      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <a class="back" href="../../">← gallery</a>

    <section class="panel" id="panel" data-level="stable">
      <h1>Subject 41</h1>
      <p class="sub">Akira project · containment telemetry</p>

      <div class="readouts">
        <div class="readout"><span>output</span><span id="r-output">—</span></div>
        <div class="readout"><span>mass</span><span id="r-mass">—</span></div>
        <div class="readout"><span>lobes</span><span id="r-lobes">—</span></div>
        <div class="readout"><span>core</span><span id="r-core">—</span></div>
      </div>

      <label class="slider" for="mutation">Psychokinetic output</label>
      <input id="mutation" type="range" min="0" max="100" value="55" />

      <p id="status">Within tolerance</p>
    </section>

    <p class="hint">drag anywhere to orbit</p>

    <pre id="error"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
