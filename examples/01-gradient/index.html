<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01 · Gradient</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #08080b;
        color: #e8e8ef;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
      }

      /* The canvas is sized by CSS; the surface reads that size and the device
         pixel ratio, so layout stays the single source of truth. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      footer {
        padding: 10px 14px;
        border-top: 1px solid #1e1e26;
        color: #8a8a99;
      }

      #error {
        padding: 14px;
        color: #ff8080;
        white-space: pre-wrap;
      }

      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <footer>
      01 · gradient — <code>space.centered</code>, <code>space.polar</code>,
      <code>color.paletteDefault</code>, <code>shaping.pulse</code>
    </footer>
    <pre id="error"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
