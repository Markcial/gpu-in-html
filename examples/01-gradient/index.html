<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>01 · Gradient</title>
    <style>
      :root {
        color-scheme: dark;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: #08080b;
        color: #e8e8ef;
        font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }

      body {
        display: grid;
        grid-template-rows: 1fr auto;
      }

      /* The canvas is sized by CSS; the surface reads that size and the device
         pixel ratio, so layout stays the single source of truth. */
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      footer {
        padding: 10px 14px;
        border-top: 1px solid #1e1e26;
        color: #8a8a99;
      }

      #error {
        padding: 14px;
        color: #ff8080;
        white-space: pre-wrap;
      }

      #error:empty {
        display: none;
      }

      .back {
        position: fixed;
        top: 16px;
        left: 18px;
        z-index: 2;
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        color: #e8e8ef;
        background: rgba(10, 10, 14, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 999px;
        padding: 7px 14px;
        backdrop-filter: blur(6px);
        transition: background 150ms ease;
      }

      .back:hover {
        background: rgba(10, 10, 14, 0.78);
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <a class="back" href="../../">← gallery</a>
    <footer>
      01 · gradient — <code>space.centered</code>, <code>space.polar</code>,
      <code>color.paletteDefault</code>, <code>shaping.pulse</code>
    </footer>
    <pre id="error"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
