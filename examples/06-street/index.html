<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>06 · Street</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #16181c;
        --dim: #55585f;
        --hair: rgba(20, 22, 26, 0.22);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100%;
        background: #23262b;
        color: var(--ink);
        font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 0;
      }

      .back {
        position: fixed;
        top: 16px;
        left: 18px;
        z-index: 3;
        font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        text-decoration: none;
        color: #f2f0ee;
        background: rgba(10, 11, 13, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 9px 14px;
        backdrop-filter: blur(8px);
      }

      main {
        position: relative;
        z-index: 1;
        max-width: 500px;
        margin: 0 auto;
        padding: 18vh 20px 26vh;
      }

      /* No background: the white rectangle behind this is road paint, drawn by
         the shader from this element's measured rect. */
      form {
        padding: 34px 30px 38px;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 25px;
        letter-spacing: -0.015em;
      }

      .lede {
        margin: 0 0 26px;
        color: var(--dim);
        font-size: 13.5px;
      }

      section + section {
        margin-top: 26px;
        padding-top: 24px;
        border-top: 1px solid var(--hair);
      }

      h2 {
        margin: 0 0 16px;
        font: 700 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #8a3a12;
      }

      .field {
        display: grid;
        gap: 5px;
        margin-bottom: 16px;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      @media (max-width: 480px) {
        .row {
          grid-template-columns: 1fr;
          gap: 0;
        }
      }

      label,
      legend {
        font: 600 10.5px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: 0.09em;
        text-transform: uppercase;
        color: var(--dim);
      }

      input,
      select,
      textarea {
        font: inherit;
        width: 100%;
        color: var(--ink);
        padding: 9px 11px;
        border-radius: 3px;
        border: 1px solid var(--hair);
        background: rgba(255, 255, 255, 0.35);
      }

      textarea {
        min-height: 74px;
        resize: vertical;
      }

      input:focus,
      select:focus,
      textarea:focus {
        outline: none;
        border-color: #b4491a;
        background: rgba(255, 255, 255, 0.7);
      }

      fieldset {
        border: none;
        margin: 0 0 16px;
        padding: 0;
      }

      .choices {
        display: flex;
        flex-wrap: wrap;
        gap: 6px 16px;
        margin-top: 7px;
      }

      .choice {
        display: flex;
        align-items: center;
        gap: 6px;
        font: 400 13px/1.4 ui-sans-serif, system-ui, sans-serif;
        text-transform: none;
        letter-spacing: 0;
        color: var(--ink);
      }

      input[type="radio"],
      input[type="checkbox"] {
        accent-color: #b4491a;
        width: 14px;
        height: 14px;
      }

      button {
        font: inherit;
        font-weight: 650;
        width: 100%;
        margin-top: 6px;
        color: #fdf6f2;
        padding: 12px;
        border: none;
        border-radius: 3px;
        background: #1d2024;
        cursor: pointer;
      }

      button:hover {
        filter: brightness(1.15);
      }

      #error {
        position: fixed;
        inset: auto 18px 18px;
        z-index: 4;
        margin: 0;
        padding: 12px;
        background: #240a0a;
        color: #ff9a9a;
        font: 12px/1.5 ui-monospace, Menlo, monospace;
        white-space: pre-wrap;
      }

      #error:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <a class="back" href="../../">← gallery</a>

    <main>
      <form id="permit">
        <section>
          <h1>Street works permit</h1>
          <p class="lede">
            The white rectangle under this form is road paint. The shader is handed the form's
            measured rect and paints the tarmac inside it — scroll to drive down the street.
          </p>
        </section>

        <section>
          <h2>Location</h2>
          <div class="row">
            <div class="field">
              <label for="street">Street</label>
              <input id="street" type="text" placeholder="Carrer Major" />
            </div>
            <div class="field">
              <label for="number">Number</label>
              <input id="number" type="number" placeholder="41" />
            </div>
          </div>
          <div class="field">
            <label for="extent">Extent (m)</label>
            <input id="extent" type="number" placeholder="18" />
          </div>
        </section>

        <section>
          <h2>Works</h2>
          <fieldset>
            <legend>Type</legend>
            <div class="choices">
              <label class="choice"><input type="radio" name="type" checked /> Resurfacing</label>
              <label class="choice"><input type="radio" name="type" /> Utilities</label>
              <label class="choice"><input type="radio" name="type" /> Markings</label>
            </div>
          </fieldset>
          <div class="row">
            <div class="field">
              <label for="start">Start</label>
              <input id="start" type="date" />
            </div>
            <div class="field">
              <label for="days">Days</label>
              <input id="days" type="number" placeholder="5" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="company">Company</label>
              <input id="company" type="text" placeholder="Obres Castelldefels SL" />
            </div>
            <div class="field">
              <label for="email">Email</label>
              <input id="email" type="email" placeholder="permits@example.com" />
            </div>
          </div>
          <button type="submit">Submit permit</button>
        </section>
      </form>
    </main>

    <pre id="error"></pre>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
